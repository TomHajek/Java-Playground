spring.application.name=discovery-service

# default eureka server port number is 8761
server.port=5000

# this service does not need to fetch any register from another discovery service
eureka.client.fetch-registry=false

# do not register yourself in this discovery service
eureka.client.register-with-eureka=false

#if we set register to true and using different port than 8761, we also have to specify the url
#eureka.client.service-url.defaultZone=https://localhost:5000/eureka/
