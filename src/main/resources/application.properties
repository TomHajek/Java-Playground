spring.application.name=employee-service

# when using 0, the port number will be alocated dynamically
server.port=0
server.servlet.context-path=/employee-service/api

spring.datasource.url=jdbc:mysql://localhost:3306/SeleniumExpress
spring.datasource.username=root
spring.datasource.password=admin

address-service.base.url=http://localhost:8082/address-service/api

#if we are using eureka server on default port (8761), we do not have to specify this property
eureka.client.service-url.defaultZone=https://localhost:5000/eureka/